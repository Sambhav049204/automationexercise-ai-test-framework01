# ===== Application under test =====
base.url=https://automationexercise.com

# ===== Browser =====
# Supported: chrome, edge
browser=chrome
headless=false

# ===== Timeouts (seconds) =====
explicit.wait.seconds=15
page.load.timeout.seconds=60

# ===== Failure handling =====
screenshot.on.failure=true
screenshot.dir=screenshots
retry.count=2


# ===== AI layer =====
# The API key is NEVER stored here: set the OPENAI_API_KEY environment variable.
# The model is not fixed here either: set ai.model (or AI_MODEL) to a model from OpenAI's current list.
ai.provider=openai
ai.base.url=https://api.openai.com/v1
ai.timeout.seconds=60
ai.max.output.tokens=2000
ai.max.steps=6
ai.max.total.tokens=50000
ai.output.dir=ai-output